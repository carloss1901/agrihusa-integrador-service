server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:agrihusa-integrador-dev-secret-key-2026}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  config:
    import: optional:file:.env[.properties]

  application:
    name: agrihusa-integrador-service

  messages:
    basename: messages/validation
    encoding: UTF-8

  datasource:
    url: ${SQLSERVER_DB_URL}
    username: ${SQLSERVER_DB_USER}
    password: ${SQLSERVER_DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      auto-commit: false
      connection-timeout: ${DB_CONNECTION_TIMEOUT:20000}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      minimum-idle: ${DB_MINIMUM_IDLE:5}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.SQLServerDialect
    open-in-view: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

cors:
  allow-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  allow-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE}
  allow-headers: ${CORS_ALLOWED_HEADERS:*}
  exposed-headers: ${CORS_EXPOSED_HEADERS:Authorization}
  max-age: ${CORS_MAX_AGE:3600}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  mapping: ${CORS_MAPPING:/**}
